<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>라이프스탁</title>
<style>
  :root{
    --bg:#0f1117; --surface:#1a1d29; --surface2:#232738; --border:#2b3042;
    --text:#eef0f6; --muted:#8a8fa8; --up:#ff4d5e; --down:#3d8bff; --gold:#f0c454; --radius:16px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif; height:100%;}
  .num{font-family:'SFMono-Regular',Consolas,'Roboto Mono',monospace; font-variant-numeric:tabular-nums;}
  #app{max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; position:relative;}
  .screen{flex:1; display:none; flex-direction:column; padding-bottom:88px;}
  .screen.active{display:flex;}

  .ticker{position:sticky; top:0; z-index:10; background:rgba(15,17,23,0.92); backdrop-filter:blur(6px);
    border-bottom:1px solid var(--border); padding:14px 18px 12px;}
  .ticker-row{display:flex; align-items:center; justify-content:space-between;}
  .ticker-logo{display:flex; align-items:center; gap:6px; font-size:15px; font-weight:800; color:var(--text);}
  .ticker-logo span{color:var(--gold);}
  .session-badge{display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:999px;
    font-size:12px; font-weight:600; background:var(--surface2); border:1px solid var(--border);}
  .session-dot{width:6px; height:6px; border-radius:50%; background:var(--gold);}
  .session-dot.open{background:var(--up); box-shadow:0 0 0 3px rgba(255,77,94,0.15);}
  .session-dot.closed{background:var(--muted);}
  .session-msg{margin-top:8px; font-size:13px; color:var(--muted);}

  .pad{padding:20px 18px;}
  .total-block{text-align:center; padding:20px 0 10px;}
  .total-label{font-size:13px; color:var(--muted); margin-bottom:6px;}
  .total-value{font-size:44px; font-weight:800;}
  .total-value.up{color:var(--up);} .total-value.down{color:var(--down);} .total-value.flat{color:var(--text);}
  .total-sub{font-size:12px; color:var(--muted); margin-top:4px;}

  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px;}
  .card + .card{margin-top:14px;}
  .card-white{background:#ffffff; border-radius:var(--radius); padding:16px; color:#1a1d29;}
  .card-title{font-size:13px; color:var(--muted); font-weight:600; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center;}
  .card-title.dark{color:#6b7086;}

  .chart-labels{display:flex; justify-content:space-between; margin-top:6px; font-size:10px; color:var(--muted);}
  .chart-labels.dark{color:#9aa0b4;}

  .char-card{display:flex; align-items:center; gap:14px; cursor:pointer;}
  .char-emoji{font-size:34px; width:52px; height:52px; display:flex; align-items:center; justify-content:center;
    background:var(--surface2); border-radius:14px; flex-shrink:0;}
  .char-name{font-weight:700; font-size:15px;}
  .char-tag{font-size:12px; color:var(--muted); margin-top:3px; line-height:1.4;}
  .chevron{margin-left:auto; color:var(--muted); font-size:18px;}

  .cta-btn{display:block; width:100%; text-align:center; padding:14px; margin-top:14px; border-radius:12px;
    background:var(--gold); color:#1a1400; font-weight:700; font-size:15px; border:none; cursor:pointer;}
  .cta-btn.secondary{background:var(--surface2); color:var(--text); border:1px solid var(--border);}
  .cta-btn.ghost{background:transparent; color:var(--muted); border:1px solid var(--border); font-weight:600; padding:10px;}

  .cat-scroll{display:flex; gap:8px; overflow-x:auto; padding:14px 18px; border-bottom:1px solid var(--border);
    -ms-overflow-style:none; scrollbar-width:none;}
  .cat-scroll::-webkit-scrollbar{display:none;}
  .cat-chip{flex-shrink:0; padding:8px 14px; border-radius:999px; background:var(--surface); border:1px solid var(--border);
    font-size:13px; font-weight:600; color:var(--muted); cursor:pointer; white-space:nowrap;}
  .cat-chip.active{background:var(--text); color:#0f1117; border-color:var(--text);}

  .item-list{padding:14px 18px;}
  .item-section-label{font-size:12px; color:var(--muted); font-weight:700; margin:18px 0 8px; padding-left:2px;}
  .item-row{display:flex; align-items:center; gap:12px; padding:13px 4px; border-bottom:1px solid var(--border);}
  .item-row:last-child{border-bottom:none;}
  .check-box{width:22px; height:22px; border-radius:7px; border:2px solid var(--border); flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:14px; color:transparent; cursor:pointer;}
  .check-box.checked{background:var(--gold); border-color:var(--gold); color:#1a1400;}
  .item-text{font-size:14.5px; flex:1; line-height:1.4;}
  .item-row.checked .item-text{color:var(--muted); text-decoration:line-through;}
  .item-row.negative .item-text{color:#c9a0a6;}
  .item-row.negative.checked .item-text{color:var(--muted);}
  .item-row.negative .check-box{border-color:#4a2f36;}
  .item-row.negative .check-box.checked{background:var(--down); border-color:var(--down); color:#fff;}

  .custom-add{display:flex; gap:8px; margin-top:16px;}
  .custom-add input{flex:1; background:var(--surface2); border:1px solid var(--border); border-radius:10px;
    padding:11px 12px; color:var(--text); font-size:14px;}
  .custom-add button{padding:0 16px; border-radius:10px; border:1px solid var(--border); background:var(--surface2); color:var(--text); font-weight:600; cursor:pointer;}

  .report-header{text-align:center; padding:24px 18px 8px;}
  .report-date{font-size:13px; color:var(--muted);}
  .report-list-item{display:flex; justify-content:space-between; align-items:center; padding:10px 0;
    border-bottom:1px solid var(--border); font-size:14px;}
  .report-list-item:last-child{border-bottom:none;}
  .report-item-cat{font-size:11px; color:var(--muted); margin-top:2px;}
  .report-val{font-family:'SFMono-Regular',Consolas,monospace; font-weight:700;}
  .report-val.up{color:var(--up);} .report-val.down{color:var(--down);}
  .empty-state{text-align:center; padding:50px 20px; color:var(--muted); font-size:14px; line-height:1.7;}

  .period-tabs{display:flex; gap:6px; margin-bottom:12px;}
  .period-tab{flex:1; text-align:center; padding:7px 0; border-radius:8px; font-size:13px; font-weight:700;
    background:#f1f2f6; color:#8b90a6; cursor:pointer;}
  .period-tab.active{background:#1a1d29; color:#fff;}

  .past-row{display:flex; justify-content:space-between; align-items:center; padding:11px 2px;
    border-bottom:1px solid #eef0f4; font-size:13.5px; cursor:pointer;}
  .past-row:last-child{border-bottom:none;}
  .past-row.disabled{cursor:default;}
  .past-row .past-date{color:#4a4f66; font-weight:600;}
  .past-row .past-holiday{color:#c3c6d4; font-size:12px;}
  .past-val{font-family:'SFMono-Regular',Consolas,monospace; font-weight:700;}
  .past-val.up{color:#ff4d5e;} .past-val.down{color:#3d8bff;} .past-val.flat{color:#a7abbd;}

  .bottom-nav{position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px;
    background:rgba(26,29,41,0.96); backdrop-filter:blur(8px); border-top:1px solid var(--border);
    display:flex; padding:8px 4px calc(8px + env(safe-area-inset-bottom));}
  .nav-btn{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 0;
    background:none; border:none; color:var(--muted); font-size:11px; cursor:pointer;}
  .nav-btn.active{color:var(--gold);}
  .nav-icon{font-size:20px;}

  .ob-overlay{position:fixed; inset:0; background:var(--bg); z-index:50; display:none; flex-direction:column;}
  .ob-overlay.active{display:flex;}
  .ob-wrap{padding:28px 24px; flex:1; display:flex; flex-direction:column;}
  .ob-close{align-self:flex-end; background:none; border:none; color:var(--muted); font-size:22px; cursor:pointer; padding:4px;}
  .ob-logo{font-size:15px; color:var(--gold); font-weight:700; letter-spacing:0.02em;}
  .ob-title{font-size:24px; font-weight:800; margin-top:14px; line-height:1.35;}
  .ob-desc{font-size:14px; color:var(--muted); margin-top:12px; line-height:1.6;}
  .ob-progress{height:4px; background:var(--surface2); border-radius:999px; margin:22px 0; overflow:hidden;}
  .ob-progress-bar{height:100%; background:var(--gold); border-radius:999px; transition:width .3s;}
  .ob-q{font-size:19px; font-weight:700; line-height:1.5; margin-bottom:22px;}
  .ob-opt{display:block; width:100%; text-align:left; padding:16px; border-radius:14px; background:var(--surface);
    border:1px solid var(--border); color:var(--text); font-size:14.5px; line-height:1.5; margin-bottom:12px; cursor:pointer;}
  .ob-opt:active{background:var(--surface2); border-color:var(--gold);}
  .ob-result-emoji{font-size:56px; text-align:center; margin-top:10px;}
  .ob-result-type{text-align:center; font-size:13px; color:var(--muted); margin-top:14px; letter-spacing:0.05em;}
  .ob-result-name{text-align:center; font-size:24px; font-weight:800; margin-top:6px;}
  .ob-result-tag{text-align:center; font-size:14px; color:var(--muted); margin-top:12px; line-height:1.6; padding:0 8px;}

  .modal-overlay{position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:60; display:none;
    align-items:flex-end; justify-content:center;}
  .modal-overlay.active{display:flex;}
  .modal-sheet{width:100%; max-width:480px; background:var(--surface); border-radius:20px 20px 0 0;
    max-height:80vh; overflow-y:auto; padding:20px 18px calc(20px + env(safe-area-inset-bottom));}
  .modal-close{width:36px; height:4px; background:var(--border); border-radius:99px; margin:0 auto 16px;}

  .report-subtabs{display:flex; gap:8px; padding:14px 18px 0;}
  .report-subtab{flex:1; text-align:center; padding:10px 0; border-radius:10px; background:var(--surface);
    border:1px solid var(--border); font-size:13.5px; font-weight:700; color:var(--muted); cursor:pointer;}
  .report-subtab.active{background:var(--gold); color:#1a1400; border-color:var(--gold);}
  .report-panel{display:none;}
  .report-panel.active{display:block;}
  .candle-select-label{text-align:center; font-size:13px; color:#6b7086; margin-top:10px; min-height:18px; font-weight:600;}
</style>
</head>
<body>
<div id="app">
  <div class="ticker">
    <div class="ticker-row">
      <div class="ticker-logo">📈 <span>라이프스탁</span></div>
      <div class="session-badge"><span class="session-dot" id="sessionDot"></span><span id="sessionLabel">-</span></div>
    </div>
    <div class="session-msg" id="sessionMsg"></div>
  </div>

  <div id="screenHome" class="screen active">
    <div class="pad">
      <div class="total-block">
        <div class="total-label">오늘의 생활태도 지수</div>
        <div class="total-value" id="todayTotal">+0.00%</div>
        <div class="total-sub" id="todaySub">아직 체크한 항목이 없어요</div>
      </div>
      <div class="card">
        <div class="card-title">최근 14일 흐름</div>
        <div><svg id="chartSvg" width="100%" height="110" viewBox="0 0 320 110"></svg></div>
        <div class="chart-labels" id="chartLabels"></div>
      </div>
      <div class="card char-card" id="charCard" onclick="onCharCardClick()"></div>
      <button class="cta-btn" onclick="goScreen('screenCheck')">지금 체크하러 가기</button>
    </div>
  </div>

  <div id="screenCheck" class="screen">
    <div class="cat-scroll" id="catScroll"></div>
    <div class="item-list" id="itemList"></div>
  </div>

  <div id="screenReport" class="screen">
    <div class="report-subtabs">
      <div class="report-subtab active" data-panel="today" onclick="setReportPanel('today')">오늘의 리포트</div>
      <div class="report-subtab" data-panel="chart" onclick="setReportPanel('chart')">차트</div>
    </div>

    <div class="report-panel active" id="panelToday">
      <div class="report-header">
        <div class="report-date" id="reportDate">-</div>
        <div class="total-value" id="reportTotal">+0.00%</div>
      </div>
      <div class="pad" style="padding-top:6px;">
        <div class="card">
          <div class="card-title">오늘 체크한 항목</div>
          <div id="reportList"></div>
        </div>
      </div>
    </div>

    <div class="report-panel" id="panelChart">
      <div class="pad" style="padding-top:16px;">
        <div class="card-white">
          <div class="period-tabs">
            <div class="period-tab active" data-p="day" onclick="setPeriod('day')">일</div>
            <div class="period-tab" data-p="week" onclick="setPeriod('week')">주</div>
            <div class="period-tab" data-p="month" onclick="setPeriod('month')">월</div>
            <div class="period-tab" data-p="year" onclick="setPeriod('year')">년</div>
          </div>
          <svg id="pastChartSvg" width="100%" height="140" viewBox="0 0 320 140"></svg>
          <div class="chart-labels dark" id="pastChartLabels"></div>
          <div class="candle-select-label" id="candleSelectLabel"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="screenProfile" class="screen">
    <div class="pad">
      <div class="card" style="text-align:center; padding:32px 16px;">
        <div style="font-size:48px;" id="profEmoji">🪙</div>
        <div style="font-size:12px; color:var(--muted); margin-top:14px; letter-spacing:0.05em;" id="profType">-</div>
        <div style="font-size:22px; font-weight:800; margin-top:6px;" id="profName">-</div>
        <div style="font-size:13.5px; color:var(--muted); margin-top:12px; line-height:1.6;" id="profTag">-</div>
      </div>
      <button class="cta-btn secondary" onclick="openQuiz()">재테크 성향 다시 검사하기</button>
      <button class="cta-btn ghost" onclick="goScreen('screenHome')">홈으로</button>
    </div>
  </div>

  <div class="bottom-nav">
    <button class="nav-btn active" data-screen="screenHome" onclick="goScreen('screenHome')"><span class="nav-icon">📈</span>홈</button>
    <button class="nav-btn" data-screen="screenCheck" onclick="goScreen('screenCheck')"><span class="nav-icon">✅</span>체크하기</button>
    <button class="nav-btn" data-screen="screenReport" onclick="goScreen('screenReport')"><span class="nav-icon">📊</span>리포트</button>
  </div>
</div>

<!-- 성향 테스트 오버레이 -->
<div class="ob-overlay" id="obOverlay">
  <div class="ob-wrap">
    <button class="ob-close" onclick="closeQuiz()">✕</button>
    <div id="obContent" style="flex:1; display:flex; flex-direction:column;"></div>
  </div>
</div>

<!-- 날짜 상세 모달 -->
<div class="modal-overlay" id="dayModal" onclick="if(event.target===this) closeDayModal()">
  <div class="modal-sheet">
    <div class="modal-close"></div>
    <div class="report-header" style="padding:4px 0 8px;">
      <div class="report-date" id="modalDate">-</div>
      <div class="total-value" id="modalTotal">+0.00%</div>
    </div>
    <div id="modalList"></div>
  </div>
</div>

<script>
/* ============ 데이터 ============ */
const HOLIDAYS_2026 = ['2026-01-01','2026-02-16','2026-02-17','2026-02-18','2026-03-01','2026-03-02','2026-05-01','2026-05-05','2026-05-24','2026-05-25','2026-06-03','2026-06-06','2026-07-17','2026-08-15','2026-08-17','2026-09-24','2026-09-25','2026-09-26','2026-10-03','2026-10-05','2026-10-09','2026-12-25'];

const CATEGORIES = {
  life: { label:'생활습관', emoji:'🌅',
    pos:['바른 자세로 앉아있기','아침에 일어나자마자 기지개 켜기','자고 일어난 자리 이불 정리하기','공복에 따뜻한 물 마시기','아침 챙겨 먹기','물 목표량만큼 마시기','가벼운 스트레칭 하기','계단 이용하기','정해진 시간에 잠자리 들기','7시간 이상 잠자기','낮잠 20분 이내로 짧게 자기','방 청소하기','책상 위 정리하기','세끼 규칙적으로 챙기기','야식 참기','대중교통이나 도보로 이동하기','하루 30분 이상 걷기','자기 전 스트레칭이나 명상하기','오늘 입을 옷 미리 정하기','세탁물 밀리지 않게 처리하기','오늘 컨디션 스스로 점검하기','약속 시간보다 여유 있게 도착하기','하루 일정 아침에 미리 확인하기','자연광 쬐기','하루 중 잠깐이라도 산책하기','내가 계획한 기상시간에 잘 일어나기','미라클모닝 실천하기 (오전 6시 이전 기상)'],
    neg:['늦잠 자서 하루를 급하게 시작함','끼니 거름','밤새움','방 정리 미룸','씻지 않고 잠듦'] },
  digital: { label:'디지털', emoji:'📱',
    pos:['자기 전 30분 폰 안 보기','잠들 때 폰 손 닿지 않는 곳에 두기','스크린타임 목표치 지키기','SNS 사용 시간 정해서 지키기','알림 확인만 하고 바로 앱 닫기','식사 중 폰 안 보기','불필요한 앱 알림 끄기','화면 없는 시간 30분 이상 갖기','유튜브 쇼츠·릴스 자제하기','온라인 논쟁 안 휘말리기','필요한 정보만 검색하고 바로 종료하기','메일함·메신저 정리하기','불필요한 구독 알림 정리하기','디지털 디톡스 시간 갖기','종이책이나 실물 자료로 읽기','화면 밝기·야간모드 설정하기','불필요한 앱 삭제하기','온라인 정보 출처 확인하기','디지털 기기 없이 식사하기','메신저 답장 미루지 않기','필요한 캡처·메모 정리하기','화면 잠금 후 다른 활동하기','온라인 쇼핑 장바구니 하루 묵히기','클라우드·파일 정리하기','오늘 하루 디지털 사용 돌아보기'],

let ITEMS = [];
function buildItems(){
  ITEMS = [];
  const tierBase = {S:0.07, M:0.20, H:0.35, XL:0.55};
  Object.keys(CATEGORIES).forEach(key=>{
    const cat = CATEGORIES[key];
    cat.pos.forEach((text,i)=>{
      const ratio = (i+1)/cat.pos.length;
      const tier = ratio<=0.6?'S': ratio<=0.85?'M': ratio<=0.97?'H':'XL';
      const jitter = ((i%3)-1)*0.01;
      const val = Math.round((tierBase[tier]+jitter)*100)/100;
      ITEMS.push({id:key+'_p'+(i+1), cat:key, text, val, tier, sign:'pos'});
    });
    cat.neg.forEach((text,i)=>{
      const t = cat.neg.length>1 ? i/(cat.neg.length-1) : 0;
      const val = -Math.round((0.10 + t*0.25)*100)/100;
      ITEMS.push({id:key+'_n'+(i+1), cat:key, text, val, tier:'N', sign:'neg'});
    });
  });
  const custom = JSON.parse(localStorage.getItem('wdna_custom')||'[]');
  custom.forEach(c=> ITEMS.push(c));
}
buildItems();

function pad2(n){return n<10?'0'+n:''+n;}
function todayStr(d){ d=d||new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function isHoliday(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  const day = d.getDay();
  if(day===0||day===6) return true;
  return HOLIDAYS_2026.includes(dateStr);
}
function getSession(now){
  now = now || new Date();
  const ds = todayStr(now);
  if(isHoliday(ds)) return {key:'holiday', label:'휴장일', msg:'오늘은 쉬는 날이에요. 체크 안 해도 지수는 그대로예요 🎌', open:false};
  const t = now.getHours()*60 + now.getMinutes();
  const ranges = [
    {key:'pre', label:'프리마켓', s:8*60, e:8*60+50, msg:'하루를 준비하는 시간이에요. 아침 루틴을 체크해보세요 🌅', open:true},

    {key:'home', label:'홈타임', s:20*60, e:24*60, msg:'내일을 위해 편하게, 자기 전 루틴을 체크해보세요 🏠', open:true}
  ];
  for(const r of ranges){ if(t>=r.s && t<r.e) return r; }
  return {key:'deep', label:'딥슬립', msg:'체크 없이 푹 쉬는 시간이에요 😴 (오전 8시에 다시 열려요)', open:false};
}
function getCheckedEntries(dateStr){ return JSON.parse(localStorage.getItem('wdna_checked_'+dateStr)||'[]'); }
function setCheckedEntries(dateStr, arr){ localStorage.setItem('wdna_checked_'+dateStr, JSON.stringify(arr)); }
function getChecked(dateStr){ return getCheckedEntries(dateStr).map(e=>e.id); }
function computeTotal(dateStr){
  const checked = getChecked(dateStr);
  let sum = 0;
  checked.forEach(id=>{ const it = ITEMS.find(x=>x.id===id); if(it) sum += it.val; });
  return Math.round(sum*100)/100;
}
function getDayOHLC(dateStr){
  const entries = getCheckedEntries(dateStr).slice().sort((a,b)=>a.ts-b.ts);
  if(entries.length===0) return {o:0,h:0,l:0,c:0,hasData:false};
  let cum=0, o=null, h=-Infinity, l=Infinity;
  entries.forEach(e=>{
    const it = ITEMS.find(x=>x.id===e.id); if(!it) return;
    cum += it.val;
    if(o===null) o = cum;
    if(cum>h) h=cum;
    if(cum<l) l=cum;
  });
  return {o:Math.round(o*100)/100, h:Math.round(h*100)/100, l:Math.round(l*100)/100, c:Math.round(cum*100)/100, hasData:true};
}

function answerQuiz(letter){
  const axisMap = {E:'EI',I:'EI',S:'SN',N:'SN',T:'TF',F:'TF',J:'JP',P:'JP'};
  const axis = axisMap[letter];
  const positiveSide = {EI:'E',SN:'S',TF:'T',JP:'J'}[axis];
  obAnswers[axis] += (letter===positiveSide ? 1 : -1);
  obIndex++;
  renderObStep();
}
function calcType(){
  let type = '';
  type += obAnswers.EI >= 0 ? 'E' : 'I';
  type += obAnswers.SN >= 0 ? 'S' : 'N';
  type += obAnswers.TF >= 0 ? 'T' : 'F';
  type += obAnswers.JP >= 0 ? 'J' : 'P';
  return type;
}
function finishQuiz(){ closeQuiz(); renderCharCard(); renderProfile(); }

/* ============ 캐릭터 카드 / 프로필 ============ */
function renderCharCard(){
  const type = localStorage.getItem('wdna_mbti');
  const wrap = document.getElementById('charCard');

    wrap.innerHTML =
      '<div class="char-emoji">🪙</div>'+
      '<div><div class="char-name">미확인 종목</div><div class="char-tag">탭하고 내 재테크 성향을 확인해보세요</div></div>'+

function onCharCardClick(){

}
function renderProfile(){
  const type = localStorage.getItem('wdna_mbti');

/* ============ 화면 전환 ============ */
function goScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active', b.dataset.screen===id));
  if(id==='screenHome') renderHome();
  if(id==='screenReport') renderReport();
}
function updateSession(){
  const s = getSession();
  document.getElementById('sessionLabel').textContent = s.label;
  document.getElementById('sessionMsg').textContent = s.msg;
  document.getElementById('sessionDot').className = 'session-dot ' + (s.open ? 'open':'closed');
}

/* ============ 체크리스트 ============ */
let activeCat = 'life';
function renderCatScroll(){
  const wrap = document.getElementById('catScroll');
  wrap.innerHTML = Object.keys(CATEGORIES).map(key=>{
    const cat = CATEGORIES[key];
    return '<div class="cat-chip'+(key===activeCat?' active':'')+'" onclick="selectCat(\''+key+'\')">'+cat.emoji+' '+cat.label+'</div>';
  }).join('');
}
function selectCat(key){ activeCat = key; renderCatScroll(); renderItems(); }
function renderItems(){
  const wrap = document.getElementById('itemList');
  const dateStr = todayStr();
  const checked = getChecked(dateStr);
  const items = ITEMS.filter(i=>i.cat===activeCat);
  const pos = items.filter(i=>i.sign==='pos');
  const neg = items.filter(i=>i.sign==='neg');
  function rowHtml(it){
    const isChecked = checked.includes(it.id);
    return '<div class="item-row'+(isChecked?' checked':'')+(it.sign==='neg'?' negative':'')+'" onclick="toggleCheck(\''+it.id+'\')">'+
      '<div class="check-box'+(isChecked?' checked':'')+'">✓</div>'+
      '<div class="item-text">'+it.text+'</div>'+
    '</div>';
  }
  wrap.innerHTML =
    '<div class="item-section-label">오늘 해볼 것</div>'+ pos.map(rowHtml).join('')+
    '<div class="item-section-label">주의할 것</div>'+ neg.map(rowHtml).join('')+
    '<div class="custom-add"><input type="text" id="customInput" placeholder="나만의 항목 직접 입력"><button onclick="addCustom()">추가</button></div>';
}
function addCustom(){
  const input = document.getElementById('customInput');
  const text = input.value.trim();
  if(!text) return;
  const custom = JSON.parse(localStorage.getItem('wdna_custom')||'[]');
  const id = 'custom_' + Date.now();
  const item = {id, cat:activeCat, text, val:0.15, tier:'M', sign:'pos'};
  custom.push(item);
  localStorage.setItem('wdna_custom', JSON.stringify(custom));
  ITEMS.push(item);
  input.value=''; renderItems();
}
function toggleCheck(id){
  const dateStr = todayStr();
  let entries = getCheckedEntries(dateStr);
  const idx = entries.findIndex(e=>e.id===id);
  if(idx>=0){ entries.splice(idx,1); } else { entries.push({id, ts:Date.now()}); }
  setCheckedEntries(dateStr, entries);
  renderItems(); renderHome(); renderReport();
}

/* ============ 홈 ============ */
function renderHome(){
  const dateStr = todayStr();
  const total = computeTotal(dateStr);
  const el = document.getElementById('todayTotal');
  el.textContent = fmtPct(total);
  el.className = 'total-value ' + (total>0?'up':total<0?'down':'flat');
  const checkedCount = getChecked(dateStr).length;
  document.getElementById('todaySub').textContent = checkedCount>0 ? ('오늘 '+checkedCount+'개 항목 체크했어요') : '아직 체크한 항목이 없어요';
  renderCharCard();
  drawHomeChart();
}
function drawHomeChart(){
  const svg = document.getElementById('chartSvg');
  const labelsWrap = document.getElementById('chartLabels');
  const days = [];
  for(let i=13;i>=0;i--){
    const d = addDays(new Date(), -i); const ds = todayStr(d);
    days.push({date:ds, holiday:isHoliday(ds), val: computeTotal(ds)});
  }
  const maxAbs = Math.max(1, ...days.map(d=>Math.abs(d.val)));
  const w=320,h=110,gap=4; const barW=(w-gap*(days.length-1))/days.length; const mid=h/2;
  let s = '<line x1="0" y1="'+mid+'" x2="'+w+'" y2="'+mid+'" stroke="#2b3042" stroke-width="1"/>';
  days.forEach((d,i)=>{
    const x = i*(barW+gap);
    if(d.holiday){ s += '<rect x="'+x+'" y="'+(mid-2)+'" width="'+barW+'" height="4" rx="2" fill="#2b3042"/>'; }
    else {
      const barH = Math.max(3, (Math.abs(d.val)/maxAbs) * (h/2-8));
      const color = d.val>=0?'#ff4d5e':'#3d8bff';
      const y = d.val>=0 ? mid-barH : mid;
      s += '<rect x="'+x+'" y="'+y+'" width="'+barW+'" height="'+barH+'" rx="2" fill="'+color+'"/>';
    }
  });
  svg.innerHTML = s; svg.setAttribute('viewBox','0 0 '+w+' '+h);
  labelsWrap.innerHTML = '<span>'+days[0].date.slice(5).replace('-','.')+'</span><span>오늘</span>';
}

/* ============ 리포트 (오늘) ============ */
function setReportPanel(name){
  document.querySelectorAll('.report-subtab').forEach(el=>el.classList.toggle('active', el.dataset.panel===name));
  document.getElementById('panelToday').classList.toggle('active', name==='today');
  document.getElementById('panelChart').classList.toggle('active', name==='chart');
  if(name==='chart') renderChartPanel();
}
function renderReport(){
  const dateStr = todayStr();
  const total = computeTotal(dateStr);
  document.getElementById('reportDate').textContent = dateStr.replace(/-/g,'.') + ' 리포트';
  const totalEl = document.getElementById('reportTotal');
  totalEl.textContent = fmtPct(total);
  totalEl.className = 'total-value ' + (total>0?'up':total<0?'down':'flat');
  const checked = getChecked(dateStr);
  const listWrap = document.getElementById('reportList');
  if(checked.length===0){
    listWrap.innerHTML = '<div class="empty-state">아직 체크한 항목이 없어요.<br>체크하러 가서 오늘의 리포트를 채워볼까요?</div>';
  } else {
    listWrap.innerHTML = checked.map(id=>{
      const it = ITEMS.find(x=>x.id===id); if(!it) return '';
      return '<div class="report-list-item"><div><div>'+it.text+'</div><div class="report-item-cat">'+(CATEGORIES[it.cat]?CATEGORIES[it.cat].label:'직접입력')+'</div></div>'+
        '<div class="report-val '+(it.val>=0?'up':'down')+'">'+fmtPct(it.val)+'</div></div>';
    }).join('');
  }
  renderChartPanel();
}

/* ============ 지난 기록: 일/주/월/년 ============ */
let reportPeriod = 'day';
function setPeriod(p){
  reportPeriod = p;
  document.querySelectorAll('.period-tab').forEach(el=>el.classList.toggle('active', el.dataset.p===p));
  renderChartPanel();
}
function buildDayData(){
  const arr = [];
  for(let i=29;i>=0;i--){
    const d = addDays(new Date(),-i); const ds = todayStr(d);
    arr.push({key:ds, label:ds.slice(5).replace('-','.'), val:computeTotal(ds), holiday:isHoliday(ds), ohlc:getDayOHLC(ds)});
  }
  return arr;
}
function getMonday(d){ const nd=new Date(d); const day=(nd.getDay()+6)%7; nd.setDate(nd.getDate()-day); return nd; }
function buildWeekData(){
  const arr = []; const thisMonday = getMonday(new Date());
  for(let i=11;i>=0;i--){
    const start = addDays(thisMonday,-7*i); let sum=0;
    for(let j=0;j<7;j++){ sum += computeTotal(todayStr(addDays(start,j))); }
    arr.push({key:todayStr(start), label:(start.getMonth()+1)+'/'+start.getDate()+'주', val:Math.round(sum*100)/100, holiday:false, clickable:false});
  }
  return arr;
}
function buildMonthData(){
  const arr = []; const now = new Date();
  for(let i=11;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    const y=d.getFullYear(), m=d.getMonth();
    const daysInMonth = new Date(y,m+1,0).getDate();
    let sum=0;
    for(let day=1; day<=daysInMonth; day++){
      const dd = new Date(y,m,day);
      if(dd > now) break;
      sum += computeTotal(todayStr(dd));
    }
    arr.push({key:y+'-'+pad2(m+1), label:(m+1)+'월', val:Math.round(sum*100)/100, holiday:false, clickable:false});
  }
  return arr;
}
function buildYearData(){
  const arr = []; const nowY = new Date().getFullYear();
  for(let i=2;i>=0;i--){
    const y = nowY-i; let sum=0;
    const start = new Date(y,0,1); const end = y===nowY? new Date() : new Date(y,11,31);
    let cur = new Date(start);
    while(cur<=end){ sum += computeTotal(todayStr(cur)); cur.setDate(cur.getDate()+1); }
    arr.push({key:''+y, label:y+'년', val:Math.round(sum*100)/100, holiday:false, clickable:false});
  }
  return arr;
}
function renderChartPanel(){
  const data = reportPeriod==='day'?buildDayData(): reportPeriod==='week'?buildWeekData(): reportPeriod==='month'?buildMonthData(): buildYearData();
  const svg = document.getElementById('pastChartSvg');
  const labelsWrap = document.getElementById('pastChartLabels');
  const isDay = reportPeriod==='day';
  const w=320, h=140, gap= isDay?6:4;
  const slot = (w-gap*(data.length-1))/data.length;
  const barW = isDay ? Math.max(3, slot*0.55) : Math.max(2, slot-2);
  const mid = h/2;
  let maxAbs;
  if(isDay){
    maxAbs = Math.max(1, ...data.map(d=> d.holiday?0: (d.ohlc.hasData ? Math.max(Math.abs(d.ohlc.h), Math.abs(d.ohlc.l)) : 0) ));
  } else {
    maxAbs = Math.max(1, ...data.map(d=>Math.abs(d.val)));
  }
  function y(v){ return mid - (v/maxAbs) * (h/2-14); }
  let s = '<rect x="0" y="0" width="'+w+'" height="'+h+'" fill="#ffffff"/>';
  s += '<line x1="0" y1="'+mid+'" x2="'+w+'" y2="'+mid+'" stroke="#e7e9ef" stroke-width="1"/>';
  data.forEach((d,i)=>{
    const cx = i*slot + slot/2;
    if(d.holiday){
      s += '<line x1="'+(cx-barW/2)+'" y1="'+mid+'" x2="'+(cx+barW/2)+'" y2="'+mid+'" stroke="#e2e4ec" stroke-width="3" stroke-linecap="round"/>';
      return;
    }
    if(isDay){
      if(!d.ohlc.hasData){ s += '<circle cx="'+cx+'" cy="'+mid+'" r="2" fill="#e2e4ec"/>'; return; }
      const o=d.ohlc.o, hi=d.ohlc.h, lo=d.ohlc.l, c=d.ohlc.c;
      const color = c>=o ? '#ff4d5e' : '#3d8bff';
      const yO=y(o), yC=y(c), yH=y(hi), yL=y(lo);
      const bodyTop = Math.min(yO,yC), bodyH = Math.max(2, Math.abs(yO-yC));
      s += '<g onclick="candleClick(\''+d.key+'\',\''+d.label+'\','+c+')" style="cursor:pointer;">';
      s += '<line x1="'+cx+'" y1="'+yH+'" x2="'+cx+'" y2="'+yL+'" stroke="'+color+'" stroke-width="2"/>';
      s += '<rect x="'+(cx-barW/2)+'" y="'+bodyTop+'" width="'+barW+'" height="'+bodyH+'" rx="1.5" fill="'+color+'"/>';
      s += '</g>';
    } else {
      const color = d.val>0?'#ff4d5e': d.val<0?'#3d8bff':'#d7d9e2';
      const barH = Math.max(3, (Math.abs(d.val)/maxAbs) * (h/2-14));
      const yy = d.val>=0 ? mid-barH : mid;
      s += '<g onclick="candleSelect(\''+d.label+'\','+d.val+')" style="cursor:pointer;">';
      s += '<rect x="'+(cx-barW/2)+'" y="'+yy+'" width="'+barW+'" height="'+barH+'" rx="2" fill="'+color+'"/>';
      s += '</g>';
    }
  });
  svg.innerHTML = s; svg.setAttribute('viewBox','0 0 '+w+' '+h);
  labelsWrap.innerHTML = '<span>'+data[0].label+'</span><span>'+data[data.length-1].label+'</span>';
  document.getElementById('candleSelectLabel').textContent = '';
}
function candleClick(key, label, val){
  document.getElementById('candleSelectLabel').textContent = label+'  '+fmtPct(val);
  openDayModal(key);
}
function candleSelect(label, val){
  document.getElementById('candleSelectLabel').textContent = label+'  '+fmtPct(val);
}

/* ============ 날짜 상세 모달 ============ */
function openDayModal(dateStr){
  const total = computeTotal(dateStr);
  document.getElementById('modalDate').textContent = dateStr.replace(/-/g,'.');
  const totalEl = document.getElementById('modalTotal');
  totalEl.textContent = fmtPct(total);
  totalEl.className = 'total-value ' + (total>0?'up':total<0?'down':'flat');
  const checked = getChecked(dateStr);
  const listWrap = document.getElementById('modalList');
  if(checked.length===0){
    listWrap.innerHTML = '<div class="empty-state">이 날은 체크한 항목이 없어요.</div>';
  } else {
    listWrap.innerHTML = checked.map(id=>{
      const it = ITEMS.find(x=>x.id===id); if(!it) return '';
      return '<div class="report-list-item"><div><div>'+it.text+'</div><div class="report-item-cat">'+(CATEGORIES[it.cat]?CATEGORIES[it.cat].label:'직접입력')+'</div></div>'+
        '<div class="report-val '+(it.val>=0?'up':'down')+'">'+fmtPct(it.val)+'</div></div>';
    }).join('');
  }
  document.getElementById('dayModal').classList.add('active');
}
function closeDayModal(){ document.getElementById('dayModal').classList.remove('active'); }

/* ============ 시작 ============ */
function init(){
  renderCatScroll(); renderItems(); renderHome(); renderReport(); renderProfile();
  updateSession(); setInterval(updateSession, 30000);
}
init();
